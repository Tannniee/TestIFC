<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="mapbox-gl.css"><link rel="stylesheet" href="geocoder.css">
<style>html,body,#map{margin:0;width:100%;height:100%;background:#101b30}.mapboxgl-ctrl-geocoder{min-width:240px;background:var(--surface-elevated,#fff);color:var(--text-primary,#18212f);border:1px solid var(--border-default,#8884);border-radius:8px;box-shadow:0 8px 24px #0002;font:12px var(--font-sans,system-ui);transition:background-color 320ms,color 320ms}.mapboxgl-ctrl-geocoder--input{color:inherit;font:inherit;height:36px}.mapboxgl-ctrl-geocoder--icon{fill:var(--text-secondary,#777)}.mapboxgl-ctrl-geocoder--button,.mapboxgl-ctrl-geocoder .suggestions{background:var(--surface-elevated,#fff);color:var(--text-primary,#18212f)}.mapboxgl-ctrl-top-right{max-width:calc(100% - 350px)}#notice{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:14px var(--font-sans,system-ui);color:white;text-align:center;max-width:360px}#credit{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font:10px var(--font-sans,system-ui);background:var(--surface-elevated,#ffffffc9);color:var(--text-secondary,#17334f);padding:3px 6px;border-radius:4px;white-space:nowrap}#credit a{color:inherit}@media(max-width:700px){.mapboxgl-ctrl-top-right{max-width:calc(100% - 286px)}.mapboxgl-ctrl-geocoder{min-width:0;width:100%}#credit{display:none}}</style>
</head><body><div id="map"></div><div id="notice"></div>
<div id="credit">BIM–GIS · <a href="https://github.com/helenkwok/bim-gis-viewer" target="_blank" rel="noopener noreferrer">Helen Kwok / IFC.js</a> · Apache-2.0</div>
<script src="mapbox-gl.js"></script><script src="geocoder.js"></script><script type="module" src="runtime.js"></script>
</body></html>
