name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
          pnpm --dir frontend install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install chromium
      - name: Install WebView2 Runtime
        shell: powershell
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $installer
          $install = Start-Process -FilePath $installer -ArgumentList "/silent", "/install" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "WebView2 Runtime installer failed with exit code $($install.ExitCode)"
          }
      - name: Run browser lifecycle E2E
        working-directory: frontend
        run: pnpm run test:e2e
      - name: Build one-file application
        run: cmd /c BuildExe.cmd
      - name: Smoke-test packaged application
        run: python packaging/smoke_test_package.py --dist dist
      - name: Smoke-test packaged WebView2 over CDP
        run: |
          $env:IFC_VIEWER_EXE = (Get-ChildItem -LiteralPath dist -Filter *.exe | Select-Object -First 1).FullName
          pnpm --dir frontend run test:webview2
      - uses: actions/upload-artifact@v7
        with:
          name: ifc-viewer-windows
          path: dist/*.exe
          if-no-files-found: error
